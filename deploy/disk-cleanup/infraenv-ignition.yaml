# InfraEnv with a generic disk-wipe that runs on every host booting the discovery ISO.
#
# The systemd unit runs BEFORE agent.service, so disks are cleared before the host
# registers as available in the Assisted Installer inventory. Because the discovery
# OS lives in RAM, no disk is mounted and every block device is wiped regardless of
# what the host previously ran (LVMO/topolvm, Portworx, Ceph, software RAID, etc).
#
# The base64 in storage.files[0].contents.source is deploy/disk-cleanup/wipe-disks.sh.
# To regenerate after editing the script:
#   base64 -w0 deploy/disk-cleanup/wipe-disks.sh
# then replace the string after "base64," below.
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: disk-cleanup-infraenv
  namespace: your-namespace
spec:
  # ---- set these for your environment ----
  clusterRef:
    name: your-cluster
    namespace: your-namespace
  pullSecretRef:
    name: pull-secret
  sshAuthorizedKey: "ssh-rsa AAAA... your-key"
  # ----------------------------------------
  ignitionConfigOverride: |
    {
      "ignition": { "version": "3.1.0" },
      "storage": {
        "files": [
          {
            "path": "/usr/local/bin/wipe-disks.sh",
            "mode": 493,
            "overwrite": true,
            "contents": {
              "source": "data:text/plain;charset=utf-8;base64,"
            }
          }
        ]
      },
      "systemd": {
        "units": [
          {
            "name": "wipe-disks.service",
            "enabled": true,
            "contents": "[Unit]\nDescription=Wipe all storage metadata before the agent registers\n# Wait until udev has enumerated all block devices so no disk is missed,\n# but run before the assisted agent registers this host to inventory.\nAfter=systemd-udev-settle.service\nWants=systemd-udev-settle.service\nBefore=agent.service\n\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/usr/local/bin/wipe-disks.sh\nStandardOutput=journal+console\n\n[Install]\nWantedBy=multi-user.target"
          }
        ]
      }
    }
